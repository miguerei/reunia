name: Build and Release (Secure)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # Only for creating/updating releases (least privilege possible for this job)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: npm run dist:mac
            artifact_name: mac
          - os: windows-latest
            script: npm run dist:win
            artifact_name: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout (pinned SHA for supply-chain security)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Without Apple Developer secrets the build must stay unsigned (notarize:true
      # would make electron-builder fail). This flips it off automatically.
      # (secrets context is not allowed in step `if`, so the check happens in bash)
      - name: Disable macOS notarization when Apple secrets are missing
        if: matrix.artifact_name == 'mac'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -z "$APPLE_ID" ]; then
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.build.mac.notarize=false;fs.writeFileSync('package.json',JSON.stringify(p,null,2));console.log('macOS notarization disabled (no APPLE_ID secret)')"
          else
            echo "Apple secrets present - keeping notarization enabled"
          fi

      # --publish never: this job only builds; the `release` job below publishes.
      # Signing env vars are exported only when the secrets exist — electron-builder
      # treats an *empty* CSC_LINK as a certificate path and fails ("not a file").
      - name: Build renderer + compile Electron + create installer
        shell: bash
        env:
          SECRET_MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          SECRET_MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$SECRET_MAC_CERTIFICATE" ]; then
            export CSC_LINK="$SECRET_MAC_CERTIFICATE"
            export CSC_KEY_PASSWORD="$SECRET_MAC_CERTIFICATE_PASSWORD"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "$SECRET_APPLE_ID" ]; then
            export APPLE_ID="$SECRET_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$SECRET_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
          fi
          ${{ matrix.script }} -- --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reunia-${{ matrix.artifact_name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release and attach installers + auto-update manifests
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          # latest*.yml + .blockmap are required by electron-updater (in-app auto-updates)
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Security notes:
# - Actions pinned to full SHA (not just tags) to prevent malicious tag moves.
# - Minimal permissions; builds happen in ephemeral GitHub runners.
#
# macOS "app is damaged" fix:
#   The error "ReunIA está dañada y no se puede abrir" on macOS is almost always
#   because the app was not code-signed + notarized. Gatekeeper blocks it.
#
#   To produce fully trusted DMGs:
#   1. Join the Apple Developer Program (99 USD/year) and create a
#      "Developer ID Application" certificate.
#   2. Export the cert + private key as .p12, base64-encode it and store as GitHub Secrets:
#        MAC_CERTIFICATE          = base64 of the .p12
#        MAC_CERTIFICATE_PASSWORD = password you set when exporting the .p12
#   3. Create an App-Specific Password for your Apple ID (https://appleid.apple.com) and store:
#        APPLE_ID                     = your Apple ID email
#        APPLE_APP_SPECIFIC_PASSWORD  = the app-specific password
#        APPLE_TEAM_ID                = your 10-character Team ID (from developer.apple.com)
#   4. When these secrets exist, the macOS job signs + notarizes automatically.
#
#   Until then builds are unsigned; users run once:
#        xattr -cr /Applications/ReunIA.app
#   and then right-click the app -> Open the first time.
#
# - Team members should verify hashes of downloaded installers when possible.
