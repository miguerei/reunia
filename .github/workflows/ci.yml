name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read   # Least privilege for CI checks

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (pinned for security)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check (renderer)
        run: npx tsc --noEmit -p tsconfig.app.json --skipLibCheck

      - name: Type check (electron)
        run: npx tsc --noEmit -p tsconfig.electron.json --skipLibCheck

      - name: Lint
        run: npm run lint

      - name: Build renderer
        run: npm run build

      - name: Build electron main (compile TS + CommonJS marker)
        run: npm run build:electron
