name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read   # Least privilege for CI checks

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (pinned for security)
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check (renderer)
        run: npx tsc --noEmit -p tsconfig.app.json --skipLibCheck

      - name: Type check (electron)
        run: npx tsc --noEmit -p tsconfig.electron.json --skipLibCheck

      - name: Lint
        run: npm run lint

      - name: Build renderer
        run: npm run build

      - name: Build electron main (compile TS)
        run: npx tsc -p tsconfig.electron.json
